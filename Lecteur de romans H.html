<DOCTYPE html>
<!--
    This is a self-contained HTML file for a web page that allows users to open links to novels and books for reading.
    It includes all necessary HTML, CSS, and Javascript within a single file.
-->
<html lang="fr">
    <!--
        The <html>tag represents the root of an HTML document.
        The lang attribute specifies the language of the document, wich is French (fr) as per the user request. 
    -->
    <head>
        <!--
            The <head> element contains machines-readable information (metadata) about the document,like its title, script, and style sheets.
        -->
            <meta charset="UTF-8" />
            <!--
            The <meta> tag with charset="UTF-8" specifies the character encoding for the document, ensuring proper display of various characters, including French accents.
            -->
            <meta name="viewport" content="width =device-width, initial-scale=1.0"/>
            <!--
                The <meta> tag with name="viewport" configures the viewport, making the page responsive and adapting to different device screen sizes.
                width=device-width sets the width of the viewport to the device's width.
                Initial-scale=1.0 sets the initial zoom level when the page is first loaded.
            -->
    <title>Lecteur de Romans et Livres
        </title>
    <!--
    The <link> tag preconnects to google fronts domain, optiminzing the loading of web fonts by establishing an early connection.
    -->        
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!--
        This <link> tag preconnects to Google Fonts static content domain, with the crossorigin attributr to handle CORS (Cross-Origin Resource Sharing)requests, further optimizing font loading.
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
        This <link> tag preconnects to Google fonts static content domain, with the crossorigin attribute to handle CORS (Cross-Origin Ressource Sharing) requests, further optiminzing font loading.
    -->
    <link

       rel="stylesheet"       
    />

        :root {

                The :root pseudo-class represents the <html> element and allows definiting css variables

           --secondary-color: #ff9800; /*Definies a secondary color(orange) */
           --text-color: #333; /*Definies a default dark text color */
           --light-text-color: #555; /*Definies a slightly lighter dark text color */

           --font-serif: "Merriweather", serif; /*  Definies serif font stack */
           --font-sans-serif: "Open Sans", sans-serif; /* Definies sans -serif font stack */
           --max-width: 1200px; /* Definies a maximumm content width for larger screens */
        }
        /* Basic reset for consistent styling accross browsers */
        *,
        *::before
        *::after {
            /*
                The universal selector (*) along with ::before and ::after pseudo-elements.
                box-sizing: border-box ensures that padding and border are included in the element's total width and height.
            */
            box-sizing: border-box;
            margin: 0; /* Removes default margin from all elements */
            padding: 0; /* removes default padding from all elements */
        }
        body {
            /*
                Styles for the <body> element.
            */
            font-family: var(--font-sans-serif); /* Sets default font to sans-serif variable */

             min-height: 100vh; /* Ensures body takes at least full viewport height */ 
        }
        header {
            /*
            Styles for the <header> element.
            */
            background-color: var(--primary-color); /* Primary color background */

            padding: 1rem 0; /* vertical padding, no horizontal padding */ 
            box-shadow: 0 2px 4px var(--box-shadow-color); /* Subtle shadow for depth */ 
        }
        header .container {
            /* Styles for a container div inside the header, content centering.
            */
            display: flex; /*Enables flexbox */
